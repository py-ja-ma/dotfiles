# Weekly flake.lock bump as a PR. `dram update --full` does the same thing by
# hand. Actions pinned to a commit (tag in the comment), as in check.yml.
#
# CI on the PR: with the default GITHUB_TOKEN GitHub does NOT run check.yml (or
# any push/pull_request workflow) on a PR an Action opened — the action's README
# says so ("close and reopen the pull request manually to kick off CI"). Until a
# fine-grained PAT (Contents + Pull requests: read/write) lives in a repo secret
# and is passed as `with: token:`, the bumped lock is only evaluated by check.yml's
# weekly schedule run, i.e. after the PR is merged.
name: update-flake-lock

on:
  schedule:
    - cron: "23 5 * * 1" # Monday 05:23 UTC, before check.yml's weekly run
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: weekly input bump"
          pr-labels: |
            dependencies
            automated
          commit-msg: "flake.lock: weekly input bump"
