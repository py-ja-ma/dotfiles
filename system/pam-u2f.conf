#
# The pam_u2f line (decisions/0019, docs/security/identity/yubikeys.md): a YubiKey as the second factor,
# after the password. system/yubikey-setup.sh writes the one line below into
# /etc/pam.d/sudo, polkit-1 and login (ly, hyprlock and the console include login),
# right after each file's password line, and keeps it equal to this; u2f-selftest.py
# tests a key with the same options. A line, not an include file: PAM fails a whole
# stack whose include file is missing (tested in a container, 2026-10-11).
#   module_unknown=ignore  pam-u2f uninstalled = no second factor, not a locked sudo
#   authfile   /etc/dram/u2f_mappings: this host's login and its keys, written from
#              keys/pam-u2f.txt only after a listed key answered a test touch here
#   nouserok   a login with no line there (second factor not on yet) is not asked
#   origin     pam://dram on every host, so one credential per key works fleet-wide
#   cue        "Please touch the FIDO authenticator." where the program shows PAM messages
#              (sudo, hyprpolkitagent); ly and hyprlock show none, the key blinks
# Never add pinverification/userverification/interactive/manual: ly answers every hidden
# prompt with the login password, so a PIN prompt would spend the key's FIDO2 PIN tries.
auth       [success=ok new_authtok_reqd=ok ignore=ignore module_unknown=ignore default=bad] pam_u2f.so authfile=/etc/dram/u2f_mappings nouserok cue origin=pam://dram appid=pam://dram
