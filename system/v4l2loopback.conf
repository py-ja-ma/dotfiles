# /etc/modprobe.d/v4l2loopback.conf — OBS "Start Virtual Camera" (docs/toolchain/profiles/creator.md).
# exclusive_caps=1 makes the device a pure output so Chromium/Electron (Discord,
# Vesktop, browsers) list it as a camera; one device, named so it is obvious.
options v4l2loopback exclusive_caps=1 devices=1 video_nr=10 card_label="OBS Virtual Camera"
