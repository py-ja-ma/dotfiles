# /etc/wsl.conf of a WSL clone (decisions/0021, system/wsl/README.md): written from the repo's
# system/wsl/wsl.conf by system/wsl-setup.sh (and by install/windows/dram-windows/wsl.ps1
# before the repo is in the distro), @HOST@/@USER@/@DISTRO@ filled from
# modules/hosts/<host>.nix. Do not hand-edit. It takes effect once the distro has fully
# stopped: wsl.exe --terminate @DISTRO@ from Windows.

[boot]
systemd=true

[user]
default=@USER@

# WSL would take the Windows computer name (cabin's is `cabin`), and dram would then load
# the bench host's file; the clone has a name of its own
[network]
hostname=@HOST@
generateHosts=true
generateResolvConf=true

# Windows programs stay callable by their full path (the agent bridge finds powershell.exe
# under /mnt/c), but never shadow Linux tools on PATH
[interop]
enabled=true
appendWindowsPath=false

[automount]
enabled=true
options=metadata,umask=022,fmask=011
mountFsTab=false

[time]
useWindowsTimezone=true
