# written by dotfiles/system/wsl-setup.sh from system/wsl/sshd.conf - do not hand-edit (system/wsl/README.md)
# The WSL clone's sshd serves VSCodium's Open Remote - SSH on the same PC only: loopback (in
# mirrored networking Windows shares it), a port Windows' own sshd (22) does not hold, keys
# only, and a touch for a security key whatever a key line says.
Port 2222
ListenAddress 127.0.0.1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
# the clone's own lines, then the YubiKeys' (keys/ssh.pub, written by wsl-setup.sh)
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
PubkeyAuthOptions touch-required
