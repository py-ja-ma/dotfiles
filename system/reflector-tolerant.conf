# /etc/systemd/system/reflector.service.d/dram.conf — installed by system/maintenance.sh.
# reflector reads its mirror status from archlinux.org, which this LAN cannot always
# reach. When it fails, keep the current
# mirrorlist (reflector only writes it on success) and end the unit cleanly instead of
# leaving reflector.service failed every week; the journal says what happened.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/reflector @/etc/xdg/reflector/reflector.conf || { echo "reflector failed (archlinux.org unreachable?) - keeping the current mirrorlist"; exit 0; }'
