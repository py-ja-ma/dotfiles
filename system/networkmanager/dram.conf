#
# /etc/NetworkManager/conf.d/dram.conf — installed by system/network-setup.sh (desktop role).
# NetworkManager runs Wi-Fi and wired on desktops and laptops; headless hosts keep
# systemd-networkd. DNS goes through systemd-resolved (DNS-over-TLS, system/harden.sh;
# docs/security/network/dns.md).

[main]
dns=systemd-resolved

[device]
# wpa_supplicant: NetworkManager's default, most-tested Wi-Fi backend (its iwd backend is
# still called experimental upstream)
wifi.backend=wpa_supplicant

[connection]
# Wi-Fi power saving off: the usual cause of drop-outs and slow wake-ups on laptop cards
wifi.powersave=2
