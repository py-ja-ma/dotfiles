# letterpress — rEFInd theme in the house palette (rEFInd-minimal structure).
#   paper #1c140f -> #100c09, ink #e6d6cb, subtext #a89484, accent #c0442b
# Included from the refind.conf that system/apply-refind.sh writes:
#   include themes/letterpress/theme.conf
# Assets are generated by system/gen-boot-assets.py and committed; the icons
# are the catppuccin/refind mocha set recoloured to ink / subtext. README.md
# lists each icon's license: Catppuccin's MIT, or rEFInd's for its stock icons.

# Keep `label`: entries show their name under the icon (decided 2026-10-05,
# when `hideui label` left five unlabeled icons on cabin). `editor` stays
# available (F2 / Insert on an entry), though under Secure Boot a signed UKI
# ignores an edited command line.
hideui singleuser,hints,arrows,badges

icons_dir themes/letterpress/icons

# Full-screen paper with a faint grain and the wordmark bottom-left. The
# top-left pixel sets the menu background colour, so it is plain paper.
banner themes/letterpress/background.png
banner_scale fillscreen

# 1px accent hairline frames on transparent (144px big / 64px small).
selection_big   themes/letterpress/selection_big.png
selection_small themes/letterpress/selection_small.png

# Only a power-off tile on the tools row.
showtools shutdown
