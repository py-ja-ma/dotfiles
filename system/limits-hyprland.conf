# /etc/security/limits.d/20-hyprland.conf — installed by dotfiles/system/maintenance.sh
# (write-on-change; edit the copy in the repo and re-run the script).
#
# Hyprland asks for SCHED_RR at its lowest priority on every start
# (src/init/initHelpers.cpp, NInit::gainRealTime: sched_get_priority_min(SCHED_RR),
# tried directly, then via rtkit if built with it). Without an rtprio limit the
# direct path fails and the log says "Failed to change process scheduling
# strategy" (older builds) / "Failed to gain realtime scheduling" (current).
# pam_limits reads this at login (system-login → ly), so it takes effect at the
# next login, not the next `hyprctl reload`. The alternative is the rtkit
# daemon; a limits line is one file and no daemon. Children do not inherit RT
# (SCHED_RESET_ON_FORK), so this only ever lifts the compositor itself.
# See docs/platforms/arch/hooks.md and https://wiki.hypr.land/Configuring/Performance/
pj - rtprio 99
pj - nice -10
