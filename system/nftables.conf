#!/usr/bin/nft -f
# SPDX-FileCopyrightText: 2026 Patrick Jordan
# SPDX-License-Identifier: MIT
#
# The host firewall: default-deny inbound; SSH and LocalSend from the LAN only, ICMP, and
# what a role opens in /etc/nftables.d/. system/harden.sh installs this file whole as
# /etc/nftables.conf, so a reinstall reproduces it exactly; edit this repo copy, then run
# sudo bash system/harden.sh again.
#
# needs:  nftables; an Arch host on its own hardware
# alone:  write `define LAN = <your subnet>` to /etc/dram/lan.nft first, or you lose SSH at
#         the next boot; copy this file to /etc/nftables.conf, `nft -c -f` it, then
#         `systemctl enable --now nftables`
# here:   installed by system/harden.sh (an `ask` hook of `dram apply`); role files from
#         recording-setup.sh, gaming-setup.sh, virt-setup.sh; `dram doctor --supply` checks it
# see:    docs/security/network/firewall.md
#
# LAN = the one subnet allowed to reach sshd and LocalSend. It is this host's own fact,
# not the repo's: harden.sh writes `define LAN = <subnet>` to /etc/dram/lan.nft (the
# subnet of the default route's interface, or DRAM_LAN=<cidr>) and keeps it on later
# runs. On another subnet, edit that file and `systemctl restart nftables`.
include "/etc/dram/lan.nft"

# Only this table is reset (what Arch's shipped nftables.conf does too). A
# `flush ruleset` here would also erase Docker's ip/ip6 filter + nat tables
# and wg-quick's `ip wg-quick-<iface>` table on every reload; containers would
# then have no NAT until `systemctl restart docker`. Still one atomic
# transaction: nft -f applies the destroy and the new table in a single shot.
destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state established,related accept
    iif "lo" accept

    # essential ICMP/ICMPv6: ping, path-MTU, NDP, and MLD. MLD carries a
    # Hop-by-Hop header, so "ip6 nexthdr icmpv6" never matched it (RFC 3810
    # §5) and a snooping switch aged this host out of its multicast groups;
    # meta l4proto skips extension headers.
    meta l4proto { icmp, ipv6-icmp } accept
    # DHCPv6 client (systemd-networkd, DHCP=yes; only used if the router's RA
    # sets M or O). The Solicit goes to ff02::1:2, the Reply comes back from
    # the server's own address, so conntrack does not see it as a reply to
    # anything — accept it explicitly, to this host's link-local address only.
    ip6 daddr fe80::/10 udp sport 547 udp dport 546 accept
    # SSH from the LAN only ($LAN comes from /etc/dram/lan.nft, above). Both
    # hosts are administered over SSH; without this rule harden.sh locks you
    # out at the next boot (it did on lantern - the rule had to be added
    # live). Change /etc/dram/lan.nft, not this line, if the subnet differs.
    # `counter`: `nft list ruleset` shows whether the rule is ever hit (the
    # "locked out" diagnosis in docs/records/handbook/11-troubleshooting.md).
    ip saddr $LAN tcp dport 22 counter accept
    # LocalSend (Flatpak, docs/toolchain/packaging/flatpak.md): LAN peers push files to tcp/53317
    # and discover each other on udp/53317 (multicast). LAN only, like sshd.
    ip saddr $LAN tcp dport 53317 counter accept
    ip saddr $LAN udp dport 53317 counter accept
    # Role openings: one file per role in /etc/nftables.d/, written by that role's hook
    # (the recorder's OBS websocket + SRT from the creator hosts: system/recording-setup.sh).
    # harden.sh keeps 00-none.nft there so the pattern always matches a file.
    include "/etc/nftables.d/*.nft"

    # sshd + LocalSend (LAN only, above) + the role files are the only inbound services. Nothing else is
    # opened; everything not matched above is dropped by the policy.
    # To log drops while debugging, uncomment:
    # limit rate 5/minute log prefix "nft-drop: "
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # This host routes nothing for the LAN; the only forwarded traffic is Docker's
    # (docker is in packages/roles/sysadmin.txt and in daily use on lantern). A drop in
    # any base chain on the forward hook is final, so Docker's own FORWARD /
    # DOCKER-* chains could not save container traffic from this policy —
    # these accepts let it through and Docker's chains still enforce isolation
    # and published-port filtering (a drop there is still final).
    ct state invalid drop
    ct state established,related accept
    # traffic leaving a container bridge (docker0, br-*): containers -> LAN/internet,
    # and container<->container on one bridge once br_netfilter is loaded
    meta iifkind "bridge" accept
    # published ports (-p): DNATed from the LAN into a bridge. LAN only, like sshd.
    ip saddr $LAN meta oifkind "bridge" accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
