# /etc/xdg/reflector/reflector.conf — read by reflector.service (weekly
# reflector.timer). Installed by system/maintenance.sh, which substitutes
# @COUNTRY@ from MAINT_COUNTRY (default "United States"; a code like US also
# works: reflector --list-countries). One argument per line, shell quoting rules.
--save /etc/pacman.d/mirrorlist
--country "@COUNTRY@"
--protocol https
--latest 10
--sort rate
