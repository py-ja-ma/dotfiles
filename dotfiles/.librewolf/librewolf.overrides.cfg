// LibreWolf autoconfig overrides. LibreWolf reads ~/.librewolf/librewolf.overrides.cfg
// on each start and applies these on top of its own librewolf.cfg, so they
// survive upgrades. defaultPref sets only the default: a value changed in
// about:config is a user pref and stays across restarts. Linked by
// modules/desktop.nix. Docs: https://librewolf.net/docs/settings/

// keep cookies + site storage across restarts: logins survive, and the Proton
// Pass extension needs its session cookie kept
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
// keep history / form data / downloads list too (same reason, less re-typing)
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
// letterboxing pads the viewport to fixed sizes — ugly grey bars on 1440p
defaultPref("privacy.resistFingerprinting.letterboxing", false);
// WebGL on: maps and browser games are unusable without it
defaultPref("webgl.disabled", false);
// restore the previous session's windows and tabs on start
defaultPref("browser.startup.page", 3);

// ---- Fonts (docs/design/typography/README.md): serif everywhere for page text.
// Pages that name no font get Literata (the house text face, opsz 7-72,
// Cyrillic + Greek); code gets Monaspace Xenon. font.name.sans-serif.* is
// left alone: pages that ask for sans-serif get Noto Sans from fontconfig,
// and there is no sans->serif alias anywhere. The browser
// chrome itself follows gsettings font-name (Literata 11) via GTK.
defaultPref("font.default.x-western", "serif");
defaultPref("font.name.serif.x-western", "Literata");
defaultPref("font.name.monospace.x-western", "Monaspace Xenon");
defaultPref("font.default.x-cyrillic", "serif");
defaultPref("font.name.serif.x-cyrillic", "Literata");
defaultPref("font.name.monospace.x-cyrillic", "Monaspace Xenon");
defaultPref("font.size.variable.x-western", 16);
defaultPref("font.size.monospace.x-western", 13);
defaultPref("font.minimum-size.x-western", 11);

// ---- Chrome (dotfiles/.librewolf/README.md). The Letterpress
// chrome is <profile>/chrome/userChrome.css, linked by dram-theme to the
// tracked ~/.librewolf/chrome/userChrome.css + themes/current/browser.css.
// Firefox only loads it with this switch (toolkit default: false).
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Compact density (0 normal, 1 compact, 2 touch) + show the option in
// Settings › Appearance. browser.uidensity is a sticky pref: this sets the
// default, an explicit choice in Settings still wins.
defaultPref("browser.uidensity", 1);
defaultPref("browser.compactmode.show", true);
// Dark / light — what RFP allows (Firefox 157 / LibreWolf 157, verified in
// layout/style/PreferenceSheet.cpp + dom/base/Document.cpp):
//   CHROME follows browser.theme.toolbar-theme (0 dark, 1 light, 2 system);
//   the active theme owns that pref ("System theme — auto" keeps it at 2) and
//   RFP is never consulted for chrome documents, so the toolbars follow the
//   portal colour-scheme that dram-theme sets (meta.sh COLOR_SCHEME). Nothing
//   to set here; browser.css additionally pins color-scheme on :root.
//   CONTENT: Document::PreferredColorScheme returns Light under RFP before
//   layout.css.prefers-color-scheme.content-override (0 dark, 1 light, 2 system)
//   or browser.theme.content-theme is even read — pages stay light by design
//   (librewolf.net/docs/faq: "one of the privacy measures that come with RFP").
//   The FAQ's opt-out is to trade RFP for FPP minus that one target:
//     defaultPref("privacy.resistFingerprinting", false);
//     defaultPref("privacy.fingerprintingProtection", true);
//     defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
//   Not applied here: giving up RFP is a choice for the person using the
//   profile, not for this file.
// Left as they are: browser.tabs.inTitlebar (2 = GTK decides; the CSD
// buttons are hidden by userChrome.css instead), browser.toolbars.bookmarks
// .visibility (LibreWolf's "always" guards RFP window rounding), widget.gtk.
// overlay-scrollbars.enabled (default true), browser.theme.* (theme-owned).
