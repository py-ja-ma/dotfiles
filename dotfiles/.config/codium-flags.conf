# Flags for the `codium` launcher (pkgs/vscodium-bin reads ~/.config/codium-flags.conf,
# one flag per line). Linked by modules/desktop.nix.
# Native Wayland (crisp on the 1.5x-scaled eDP panel, no XWayland blur)
--ozone-platform-hint=auto
# IME/input-method support under Wayland
--enable-wayland-ime
# keep tokens/secrets in gnome-keyring instead of a plaintext file
--password-store=gnome-libsecret
