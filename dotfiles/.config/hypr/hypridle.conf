# hypridle — idle management. Started from hyprland.lua autostart.
# Timeline: 30 min → lock (+ suspend on battery) · 45 min → screens off.
# Lock now comes BEFORE screens-off, so there's no dark-but-unlocked window
# (the old 10-min screens-off left the desktop wakeable-unlocked until 30 min).
# NOTE: this Hyprland build runs a Lua config, so `hyprctl dispatch` only takes
# Lua dispatchers (hl.dsp.*); the classic "dpms on" string form is a syntax
# error here. hl.dsp.dpms takes a TABLE — a bare string argument means "toggle",
# which is why `after_sleep_cmd` used to blank screens that had already woken.

general {
    lock_cmd = pidof hyprlock || hyprlock        # never stack a second hyprlock
    before_sleep_cmd = loginctl lock-session     # lock BEFORE suspend, so resume shows the lock screen
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: lock the session (goes through logind, which triggers lock_cmd above)
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# 45 min: screens off — 15 min after the lock, so the screen shows the lock
# screen (bright) for a bit, then goes dark. On battery the machine has already
# suspended at 30 min, so this mainly matters on AC.
listener {
    timeout = 2700
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend — but only on battery, so the docked multi-monitor
# setup never suspends under you. Every adapter's */online is 1 when plugged
# in, whatever its name (AC, ACAD, ADP1 …); a desktop has no */online at all,
# so the loop is a no-op there and the glob is left unexpanded (cat fails quietly).
listener {
    timeout = 1800
    on-timeout = sh -c 'for f in /sys/class/power_supply/*/online; do [ "$(cat "$f" 2>/dev/null)" = 0 ] && exec systemctl suspend; done'
}
