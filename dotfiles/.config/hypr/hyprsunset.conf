# hyprsunset.conf — blue-light filter (https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/)
#
# hyprland.lua starts `hyprsunset` (no arguments) at login; it idles at identity
# (no colour shift) until something talks to it over IPC:
#   * dram-theme-auto (every 10 min + at login, modules/desktop.nix) sets
#     `temperature 4000` after sunset and `identity` after sunrise, from the
#     sun position for `dram.location` — the same clock that picks washi-day.
#   * nightlight.sh (SUPER+ALT+N) is the manual override; its next press hands
#     back to the sun.
# No fixed `profile { time = HH:MM }` blocks: they cannot follow the sun or a
# move, and in 0.4 a profile's gamma is a FRACTION (1.0), not a percentage.
# `hyprctl hyprsunset temperature` keeps printing the LAST value set after an
# `identity` (0.4.0 only flips a bool); query `hyprctl hyprsunset identity get`
# (true by day) for the state. Only one hyprsunset may run at a time.

max-gamma = 100
