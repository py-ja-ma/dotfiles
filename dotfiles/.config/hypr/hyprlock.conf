# hyprlock — the title page (dotfiles/.config/hypr/README.md, "hyprlock").
# Palette comes from the active theme (dram-theme repoints themes/current).
source = ~/.config/themes/current/hyprlock.conf
# Triggered by: SUPER+L, hypridle (30 min idle), and before suspend.
# Screens go dark at 45 min — AFTER the 30-min lock — so there's no
# dark-but-unlocked window.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The lock screen fades in like a page being laid down (hyprlock 0.9 syntax:
# animation = name, on/off, speed, curve). The curve is the same md3 decel the
# compositor uses for windowsIn.
animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, decel
    animation = fadeOut, 1, 3, decel
    animation = inputFieldDots, 1, 2, decel
}

# The quote wallpaper IS the page: no blur, a touch of grain, slightly dimmed
# so the ink above it reads. quote-wallpaper.sh always writes this file (and
# re-renders it in the theme's colours on every dram-theme switch).
background {
    monitor =
    path = ~/pictures/wallpapers/quote-wall.png
    blur_passes = 0
    noise = 0.02
    brightness = 0.85
    color = $base
}

# Clock — the big Fraunces numeral (display face; never carries Russian text).
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 150
    font_family = Fraunces
    position = 0, 110
    halign = center
    valign = center
}

# One accent rule under the clock — the only place the accent ink appears.
shape {
    monitor =
    size = 160, 1
    color = $accent
    rounding = 0
    position = 0, 8
    halign = center
    valign = center
}

# Date in Russian when the locale exists, English otherwise — EB Garamond has
# Cyrillic, Fraunces does not, so this label is always Garamond italic.
label {
    monitor =
    text = cmd[update:60000] if locale -a 2>/dev/null | grep -qi '^ru_RU\.utf-\?8$'; then LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"; else date +"%A, %-d %B"; fi
    color = $subtext
    font_size = 24
    font_family = EB Garamond Italic
    position = 0, -34
    halign = center
    valign = center
}

# Password field — a bare rule-bordered box, no fill, no rounding. The outline
# is the subtext hairline; it turns accent while checking, red on failure.
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.3
    outer_color = $subtext
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = $text
    font_family = Literata
    check_color = $accent
    fail_color = $fail
    fail_text = <i>нет ($ATTEMPTS)</i>
    placeholder_text = <i>пароль…</i>
    fade_on_empty = false
    rounding = 0
    position = 0, -130
    halign = center
    valign = center
}

# Keyboard layout, bottom-right, in the readout mono. kb_layout is "us,ru", so
# this reads "en" or "ru" for whichever layout is active at the lock screen.
label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $subtext
    font_size = 12
    font_family = Monaspace Xenon
    position = -28, 22
    halign = right
    valign = bottom
}
