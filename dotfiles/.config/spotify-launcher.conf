# ~/.config/spotify-launcher.conf — read by spotify-launcher ([extra]), which
# downloads Spotify's own .deb and verifies the apt Release signature itself
# (replaces the AUR `spotify` wrapper + spotify-flags.conf, 2026-10-06;
# docs/security/README.md). Linked by modules/desktop.nix. Key names from
# https://github.com/kpcyrd/spotify-launcher README.
[spotify]
# native Wayland (crisp on the 1.5x-scaled eDP panel, no XWayland blur) +
# IME/input-method support under Wayland. Test: spotify-launcher -v --skip-update --no-exec
extra_arguments = ["--ozone-platform-hint=auto", "--enable-wayland-ime"]
