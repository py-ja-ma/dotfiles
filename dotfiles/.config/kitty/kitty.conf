# kitty terminal  ·  base config (colors live in the active theme, see include below)
#
# THEME RULE: never hardcode a color here. dram-theme swaps
# ~/.config/themes/current -> a theme dir whose kitty.conf defines every
# color0-15 + tab/border/cursor color. That file is include'd at the bottom.
#
# GLYPH RULE: no literal Nerd Font (private-use) glyphs in this file — the
# editor that writes it strips them. Use kitty's own tokens ({bell_symbol},
# {activity_symbol}) or inject glyphs later with python3 -c 'print(chr(0x..))'.
#
# SYNTAX NOTE: kitty has NO inline comments — a "#" after a value becomes part
# of the value. Every comment here lives on its own line.

# ---- font (Letterpress house mono, docs/design/typography/README.md) ---------
# Monaspace Xenon is the slab-serif mono (pacman: otf-monaspace); Radon, its
# handwritten sibling, is the italic. Texture-healing (calt) + ligatures (liga)
# + the ss01-03 stylistic sets are on. Fallback to the Nerd Font until the
# package is installed is handled by fontconfig (modules/desktop.nix).
font_family        family="Monaspace Xenon" features="+calt +liga +ss01 +ss02 +ss03"
bold_font          auto
italic_font        family="Monaspace Radon"
bold_italic_font   auto
font_size          12.0

# Icons: Monaspace has no private-use glyphs, so every Nerd Font codepoint is
# routed to the one symbol font (pacman: ttf-nerd-fonts-symbols).
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono

# ligatures everywhere EXCEPT the cell under the cursor, so you can see the
# real characters while editing (e.g. -> stays -> when the caret is on it).
disable_ligatures  cursor

# a little leading — a slab serif wants more air between lines than a grotesk.
modify_font        cell_height 110%

# crisper undercurls for spellcheck / LSP diagnostics.
undercurl_style    thin-sparse

# ---- cursor ------------------------------------------------------------------
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
# subtle motion trail when the cursor jumps across the screen (kitty 0.36+).
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ---- window ------------------------------------------------------------------
window_padding_width     10
# Hyprland draws the frame; kitty draws no client titlebar.
hide_window_decorations  yes
placement_strategy       center
confirm_os_window_close  0

# opacity is 0.92 (Hyprland blur is OFF — the sheet is flat paper, not glass).
# dynamic_ lets you nudge it live with kitty_mod+a > m / l / 1 / d.
background_opacity          0.92
dynamic_background_opacity  yes

# paper grain: a tiled 256px grey-noise PNG (generated; README.md, "Paper grain"),
# tinted 97% toward the theme's background colour so only a whisper of
# texture survives under the text. Set background_tint 1.0 to switch it off
# without losing the image.
background_image         ~/.config/kitty/grain.png
background_image_layout  tiled
background_tint          0.97
background_tint_gaps     1.0

# ---- bell & long-command notifications --------------------------------------
enable_audio_bell      no
window_alert_on_bell   yes
# Toast when a command in an UNFOCUSED kitty window finishes and it took >10s
# — handy for long pacman/ssh/build jobs (needs shell integration, on by default).
notify_on_cmd_finish   unfocused 10.0

# ---- scrollback --------------------------------------------------------------
scrollback_lines                20000
# megabytes of scrollback the pager (kitty_mod+g) can page back through.
scrollback_pager_history_size   32
scrollback_fill_enlarged_window yes

# ---- urls & selection --------------------------------------------------------
url_style              curly
detect_urls            yes
underline_hyperlinks   hover
# drop trailing whitespace when copying a selection.
strip_trailing_spaces  smart

# ---- layouts (kitty's own splits, independent of Hyprland tiling) -----------
enabled_layouts        splits:split_axis=horizontal,stack

# ---- tab bar: a running head (README.md -> The running head) ----------------
# Not pills: the tabs are set as words on the page, like the running head of a
# printed book. The accent is the ink of the active title (never a fill), the
# rest sit in the subtext ink, and the bar shares the sheet's own background —
# the five colours come from the theme (bin/gen-kitty-tabs.py derives them).
# tab_bar.py (custom style) draws the same separator layout and, after the last
# tab, a right-aligned Russian date in italic; if it ever fails to load, kitty
# falls back to its own fade style, so the colours below still hold. No
# tab_bar_margin_width: kitty paints side margins opaque, a dark notch on a
# translucent sheet; the separator's own leading space is the gap.
tab_bar_edge            top
tab_bar_style           custom
tab_separator           " · "
tab_bar_margin_height   6 2
tab_bar_min_tabs        2
# italic = Monaspace Radon, the serif-ish voice; the active title gets it.
active_tab_font_style   italic
inactive_tab_font_style normal
# printer's marks, not emoji: "!" for a bell, "*" for activity, both red.
bell_on_tab             "! "
tab_activity_symbol     "* "
# "№ 3  title" — the same numeral style as the bar's workspace; Monaspace 1.400
# carries U+2116 (README.md, "The running head").
tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}№ {index}  {title}"

# ---- keymaps (kitty_mod = ctrl+shift; separate namespace from SUPER binds) ---
# splits inside one kitty window, opened in the current directory
map kitty_mod+enter   new_window_with_cwd
map kitty_mod+\       launch --location=vsplit --cwd=current
map kitty_mod+minus   launch --location=hsplit --cwd=current
# move focus between splits, vim-style
map kitty_mod+h       neighboring_window left
map kitty_mod+j       neighboring_window down
map kitty_mod+k       neighboring_window up
map kitty_mod+l       neighboring_window right
# new tab keeps the current directory
map kitty_mod+t       new_tab_with_cwd
# hints kitten: pluck things off the screen without the mouse.
# p>f copy a file path · p>l copy a line · p>w copy a word · p>h copy a hash · p>o open a path
map kitty_mod+p>f     kitten hints --type path --program @
map kitty_mod+p>l     kitten hints --type line --program @
map kitty_mod+p>w     kitten hints --type word --program @
map kitty_mod+p>h     kitten hints --type hash --program @
map kitty_mod+p>o     kitten hints --type path --program default
# type any unicode char by name/codepoint
map kitty_mod+u       kitten unicode_input
# wipe screen + scrollback
map kitty_mod+delete  clear_terminal reset active
# rehomed defaults: kitty_mod+h/l were show_scrollback / next_layout, but the
# vim split-nav above took those keys — so put the two actions on free keys.
map kitty_mod+g       show_scrollback
map kitty_mod+z       goto_layout stack

# ---- colors (swapped by dram-theme) -----------------------------------------
# reload live after a theme switch with:  kill -SIGUSR1 $(pgrep kitty)
include ~/.config/themes/current/kitty.conf
