# Soft Color — yazi flavor (Letterpress: paper, ink, one accent; generated by bin/gen-yazi-flavors.py)
# Every key is one yazi 26.9.1 ships in yazi-config/preset/theme-dark.toml. No bg = the terminal's paper.

[mgr]
cwd = { fg = "#ff9a8b", bold = true }

# Find
find_keyword  = { fg = "#ff9a8b", bold = true, underline = true }
find_position = { fg = "#beb8c2", bg = "reset", italic = true }

# Symlink
symlink_target = { fg = "#beb8c2", italic = true }

# Marker — a 1-cell rule in the margin: selected = accent, copied = yellow, cut = red
marker_copied   = { fg = "#ffcf8b", bg = "#ffcf8b" }
marker_cut      = { fg = "#ff7a85", bg = "#ff7a85" }
marker_marked   = { fg = "#b86f64", bg = "#b86f64" }
marker_selected = { fg = "#ff9a8b", bg = "#ff9a8b" }
marker_symbol   = "│"

# Count — a coloured figure on the surface tint, not a filled badge
count_copied   = { fg = "#ffcf8b", bg = "#3a4061", bold = true }
count_cut      = { fg = "#ff7a85", bg = "#3a4061", bold = true }
count_selected = { fg = "#ff9a8b", bg = "#3a4061", bold = true }

# Border — one hairline grey
border_symbol = "│"
border_style  = { fg = "#66667c" }

[tabs]
active   = { fg = "#ff9a8b", bold = true }
inactive = { fg = "#beb8c2" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Mode — a plain bold word, no powerline pill
[mode]
normal_main = { fg = "#ff9a8b", bold = true }
normal_alt  = { fg = "#beb8c2" }
select_main = { fg = "#ffcf8b", bold = true }
select_alt  = { fg = "#beb8c2" }
unset_main  = { fg = "#ff7a85", bold = true }
unset_alt   = { fg = "#beb8c2" }

# The cursor row — accent ink on the surface tint, never reversed video
[indicator]
parent  = { fg = "#b86f64", bg = "#3a4061" }
current = { fg = "#ff9a8b", bg = "#3a4061", bold = true }
preview = { bg = "#3a4061" }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#7f8097" }
perm_type  = { fg = "#ff9a8b" }
perm_read  = { fg = "#beb8c2" }
perm_write = { fg = "#beb8c2" }
perm_exec  = { fg = "#a8d8b0" }

# Progress
progress_label  = { fg = "#fdf0ed", bold = true }
progress_normal = { fg = "#ff9a8b", bg = "#444b6e" }
progress_error  = { fg = "#ff7a85", bg = "#444b6e" }

[which]
border          = { fg = "#66667c" }
cols            = 3
mask            = {}
cand            = { fg = "#ff9a8b" }
rest            = { fg = "#7f8097" }
desc            = { fg = "#fdf0ed" }
separator       = "  "
separator_style = { fg = "#7f8097" }

[confirm]
border     = { fg = "#66667c" }
title      = { fg = "#ff9a8b", bold = true }
body       = {}
list       = {}
btn_yes    = { fg = "#ff9a8b", bold = true }
btn_no     = { fg = "#beb8c2" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#66667c" }
title    = { fg = "#ff9a8b", bold = true }
tbl_col  = { fg = "#ff9a8b" }
tbl_cell = { fg = "#fdf0ed", bg = "#3a4061" }

[notify]
title_info  = { fg = "#a8d8b0" }
title_warn  = { fg = "#ffcf8b" }
title_error = { fg = "#ff7a85" }
icon_info  = "·"
icon_warn  = "!"
icon_error = "×"

[pick]
border   = { fg = "#66667c" }
active   = { fg = "#ff9a8b", bold = true }
inactive = {}

[input]
border   = { fg = "#66667c" }
title    = { fg = "#ff9a8b", bold = true }
value    = {}
selected = { bg = "#444b6e" }

[cmp]
border   = { fg = "#66667c" }
active   = { fg = "#ff9a8b", bg = "#3a4061" }
inactive = {}
icon_file    = "·"
icon_folder  = "/"
icon_command = ":"

[tasks]
border  = { fg = "#66667c" }
title   = { fg = "#ff9a8b", bold = true }
hovered = { fg = "#ff9a8b", bg = "#3a4061" }

[help]
border  = { fg = "#66667c" }
chord   = { fg = "#ff9a8b" }
action  = { fg = "#fdf0ed" }
hovered = { fg = "#ff9a8b", bg = "#3a4061", bold = true }

# File-specific styles — first match wins
[filetype]
rules = [
	# Broken things
	{ url = "*", is = "orphan", fg = "#ff7a85", italic = true },
	{ url = "*", is = "dummy", fg = "#ff7a85", italic = true },
	{ url = "*/", is = "dummy", fg = "#ff7a85", italic = true },
	# Symlinks are italic, in whatever colour the ink is
	{ url = "*", is = "link", italic = true },
	{ url = "*/", is = "link", fg = "#b86f64", italic = true },
	# Executables
	{ url = "*", is = "exec", fg = "#a8d8b0" },
	# Image
	{ mime = "**/image/*", fg = "#beb8c2" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#beb8c2", italic = true },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#7f8097" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#7f8097" },
	# Directories
	{ url = "*/", fg = "#b86f64", bold = true },
]

# No icons: Letterpress sets its chrome in words, not Nerd-font glyphs
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
