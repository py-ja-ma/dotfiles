# Tokyo Night — yazi flavor (Letterpress: paper, ink, one accent; generated by bin/gen-yazi-flavors.py)
# Every key is one yazi 26.9.1 ships in yazi-config/preset/theme-dark.toml. No bg = the terminal's paper.

[mgr]
cwd = { fg = "#7aa2f7", bold = true }

# Find
find_keyword  = { fg = "#7aa2f7", bold = true, underline = true }
find_position = { fg = "#a9b1d6", bg = "reset", italic = true }

# Symlink
symlink_target = { fg = "#a9b1d6", italic = true }

# Marker — a 1-cell rule in the margin: selected = accent, copied = yellow, cut = red
marker_copied   = { fg = "#e0af68", bg = "#e0af68" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#5875b2", bg = "#5875b2" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }
marker_symbol   = "│"

# Count — a coloured figure on the surface tint, not a filled badge
count_copied   = { fg = "#e0af68", bg = "#292e42", bold = true }
count_cut      = { fg = "#f7768e", bg = "#292e42", bold = true }
count_selected = { fg = "#7aa2f7", bg = "#292e42", bold = true }

# Border — one hairline grey
border_symbol = "│"
border_style  = { fg = "#53576c" }

[tabs]
active   = { fg = "#7aa2f7", bold = true }
inactive = { fg = "#a9b1d6" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Mode — a plain bold word, no powerline pill
[mode]
normal_main = { fg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#a9b1d6" }
select_main = { fg = "#e0af68", bold = true }
select_alt  = { fg = "#a9b1d6" }
unset_main  = { fg = "#f7768e", bold = true }
unset_alt   = { fg = "#a9b1d6" }

# The cursor row — accent ink on the surface tint, never reversed video
[indicator]
parent  = { fg = "#5875b2", bg = "#292e42" }
current = { fg = "#7aa2f7", bg = "#292e42", bold = true }
preview = { bg = "#292e42" }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#565f89" }
perm_type  = { fg = "#7aa2f7" }
perm_read  = { fg = "#a9b1d6" }
perm_write = { fg = "#a9b1d6" }
perm_exec  = { fg = "#9ece6a" }

# Progress
progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#414868" }
progress_error  = { fg = "#f7768e", bg = "#414868" }

[which]
border          = { fg = "#53576c" }
cols            = 3
mask            = {}
cand            = { fg = "#7aa2f7" }
rest            = { fg = "#565f89" }
desc            = { fg = "#c0caf5" }
separator       = "  "
separator_style = { fg = "#565f89" }

[confirm]
border     = { fg = "#53576c" }
title      = { fg = "#7aa2f7", bold = true }
body       = {}
list       = {}
btn_yes    = { fg = "#7aa2f7", bold = true }
btn_no     = { fg = "#a9b1d6" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#53576c" }
title    = { fg = "#7aa2f7", bold = true }
tbl_col  = { fg = "#7aa2f7" }
tbl_cell = { fg = "#c0caf5", bg = "#292e42" }

[notify]
title_info  = { fg = "#9ece6a" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }
icon_info  = "·"
icon_warn  = "!"
icon_error = "×"

[pick]
border   = { fg = "#53576c" }
active   = { fg = "#7aa2f7", bold = true }
inactive = {}

[input]
border   = { fg = "#53576c" }
title    = { fg = "#7aa2f7", bold = true }
value    = {}
selected = { bg = "#414868" }

[cmp]
border   = { fg = "#53576c" }
active   = { fg = "#7aa2f7", bg = "#292e42" }
inactive = {}
icon_file    = "·"
icon_folder  = "/"
icon_command = ":"

[tasks]
border  = { fg = "#53576c" }
title   = { fg = "#7aa2f7", bold = true }
hovered = { fg = "#7aa2f7", bg = "#292e42" }

[help]
border  = { fg = "#53576c" }
chord   = { fg = "#7aa2f7" }
action  = { fg = "#c0caf5" }
hovered = { fg = "#7aa2f7", bg = "#292e42", bold = true }

# File-specific styles — first match wins
[filetype]
rules = [
	# Broken things
	{ url = "*", is = "orphan", fg = "#f7768e", italic = true },
	{ url = "*", is = "dummy", fg = "#f7768e", italic = true },
	{ url = "*/", is = "dummy", fg = "#f7768e", italic = true },
	# Symlinks are italic, in whatever colour the ink is
	{ url = "*", is = "link", italic = true },
	{ url = "*/", is = "link", fg = "#5875b2", italic = true },
	# Executables
	{ url = "*", is = "exec", fg = "#9ece6a" },
	# Image
	{ mime = "**/image/*", fg = "#a9b1d6" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#a9b1d6", italic = true },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#565f89" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#565f89" },
	# Directories
	{ url = "*/", fg = "#5875b2", bold = true },
]

# No icons: Letterpress sets its chrome in words, not Nerd-font glyphs
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
