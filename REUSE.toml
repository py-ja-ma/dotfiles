# REUSE.toml: the copyright holder and license of every file in this repo, in the
# REUSE layout (https://reuse.software/spec-3.3/); the license texts are in LICENSES/.
# Everything I wrote is MIT. A file's own SPDX lines win over a table here unless the
# table says "override", and when several tables match a path the last one wins, so the
# catch-all comes first and the exceptions after it.
version = 1

# Everything I wrote: code, configuration and pages.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Patrick Jordan"
SPDX-License-Identifier = "MIT"

# Facts with no author: the lock file, harvested host state, public keys.
[[annotations]]
path = [
  "flake.lock",
  "hosts/*/packages/**",
  "hosts/*/systemd/**",
  "hosts/*/hardware.txt",
  "hosts/*/secureboot-baseline-*.txt",
  "keys/**",
  "pkgs/dram.asc",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Copies of /etc files from the Arch packages that ship them, with local edits.
[[annotations]]
path = "hosts/*/etc/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of the Arch Linux packages that ship each file"
SPDX-License-Identifier = "LicenseRef-Arch-Package-Files"

# The rEFInd Catppuccin theme, vendored unmodified (its LICENSE is in the directory).
[[annotations]]
path = "system/refind-catppuccin/**"
precedence = "override"
SPDX-FileCopyrightText = "2021 Catppuccin"
SPDX-License-Identifier = "MIT"

# The Letterpress boot icons: Catppuccin's Mocha icons, recolored by system/gen-boot-assets.py.
[[annotations]]
path = "system/refind-letterpress/icons/**"
precedence = "override"
SPDX-FileCopyrightText = ["2021 Catppuccin", "2026 Patrick Jordan"]
SPDX-License-Identifier = "MIT"

# EB Garamond Italic 1.003, with the OFL text beside it.
[[annotations]]
path = ["dotfiles/.local/share/fonts/EBGaramond-Italic.ttf", "dotfiles/.local/share/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 The EB Garamond Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Hyprland's example configuration, which hyprland.lua grew from.
[[annotations]]
path = "dotfiles/.config/hypr/hyprland.lua"
precedence = "override"
SPDX-FileCopyrightText = ["2022-2026 vaxerski", "2026 Patrick Jordan"]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

# yazi's status bar component, mirrored by init.lua with one change.
[[annotations]]
path = "dotfiles/.config/yazi/init.lua"
precedence = "override"
SPDX-FileCopyrightText = ["2023 sxyazi", "2026 Patrick Jordan"]
SPDX-License-Identifier = "MIT"

# Upstream inputs of bin/gen-windows-look.py, pinned by sha256, and the files it derives from them.
[[annotations]]
path = "install/windows/upstream/mumble/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of mumble-voip/mumble-theme"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "install/windows/upstream/notepad++/**"
precedence = "override"
SPDX-FileCopyrightText = "The Notepad++ authors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "install/windows/letterpress/notepad++/**"
precedence = "override"
SPDX-FileCopyrightText = ["The Notepad++ authors", "2026 Patrick Jordan"]
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "install/windows/upstream/wireshark/**"
precedence = "override"
SPDX-FileCopyrightText = "The Wireshark authors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "install/windows/letterpress/wireshark/**"
precedence = "override"
SPDX-FileCopyrightText = ["The Wireshark authors", "2026 Patrick Jordan"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# The Windows side of the case display began as motiop's antec-flux-pro-display-windows.
[[annotations]]
path = "install/windows/dram-windows/case-display.ps1"
precedence = "override"
SPDX-FileCopyrightText = ["2026 motiop", "2026 Patrick Jordan"]
SPDX-License-Identifier = "MIT"

# Package recipes from the Arch package sources and the AUR (pkgs/<name>/): each keeps
# its source's terms; the maintainers are named in each PKGBUILD's header.
[[annotations]]
path = "pkgs/*/**"
precedence = "override"
SPDX-FileCopyrightText = ["The maintainers named in each PKGBUILD", "2026 Patrick Jordan"]
SPDX-License-Identifier = "LicenseRef-Arch-Recipe"

# My review, upstream and pin records beside each recipe, and my own two packages.
[[annotations]]
path = ["pkgs/*/REVIEW.md", "pkgs/*/UPSTREAM", "pkgs/*/PIN", "pkgs/dram-case-display/**", "pkgs/dram-gaming-mode/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Patrick Jordan"
SPDX-License-Identifier = "MIT"

# Upstream signing keys a recipe verifies its sources with.
[[annotations]]
path = "pkgs/*/keys/**"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "pkgs/vscodium-bin/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2018-present The VSCodium contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "pkgs/jagex-launcher/JAGEX-EULA"
precedence = "override"
SPDX-FileCopyrightText = "Jagex Ltd"
SPDX-License-Identifier = "LicenseRef-Jagex-EULA"

